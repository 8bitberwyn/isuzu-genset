<!DOCTYPE html>
<html>

<head>
    <title>Isuzu Generator Sound Demo</title>
    <link rel="icon" type="image/png" href="/assets/logo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        html,
        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 1024px;
            width: 1366px;
            margin: 0;
            padding: 0
        }

        h2 {
            font-size: 2em;
            font-weight: 500;
            padding: 0;
        }

        td {
            border: 2px inset rgb(163, 163, 163);
        }

        td.active h2 {
            width: 100%;
            font-size: 2.4em;
            text-align: center;
            color: white;
            position: absolute;
            top: 10%;
        }

        td.active br {
            display: none;
        }

        h2.center-title, td.active h2.center-title{
            display: block;
            width: 100%;
            text-align: center;
            font-size: 3.2em;
            margin-top: 0;
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: black;
        }

        h2.center-title .red-text {
            color: rgb(235, 0, 0);
            display: block;
            margin-bottom: 5px;
        }

        strong {
            display: block;
            font-size: 1.7rem;
            line-height: 18px;
            margin-top: 10px;
            font-weight: 500;
        }

        table {
            height: 100%;
            border-collapse: collapse;
        }

        td {
            position: relative;
            width: 28%;
            height: 33%;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            background-image: linear-gradient(to bottom, rgb(230, 230, 230), rgb(250, 250, 250));
        }

        td.active {
            background-image: linear-gradient(to bottom, rgb(243, 0, 0), rgb(182, 0, 0));
        }

        td[rowspan="3"], td[rowspan="3"].active {
            width: 42%;
            height: 100%;
            background-image:
                linear-gradient(to top, white, transparent 0%),
                linear-gradient(to bottom, white, transparent 40%),
                url('/assets/bg.jpg');
            background-position: center;
            background-size: cover;
            background-position: center;
        }

        .pair {
            display: flex;
            flex-direction: column;
            flex: row;
            align-items: center;
        }

        .icon {
            width: 100px;
            position: relative;
            margin: 0;
            mix-blend-mode: multiply;
            object-fit: contain;
            overflow: hidden;
            max-height: 100px;
        }

        td.active .icon {
            display: none;
        }

        .single {
            padding-top: 9px;
        }

        .subtext {
            font-size: 20px;
            line-height: 27px;
            font-weight: 300;
            margin: 0;
        }

        .logo {
            width: 25%;
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
        }

        .colour-img, .outline-img {
            width: 78%;
            position: absolute;
            left: 50%;
            bottom: 50%;
            object-fit: contain;
            overflow: hidden;
            transform: translate(-50%, 50%);
        }

        td.active .outline-img {
            display: none;
        }

        td.active .-img {

        }   
        .trapezium {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 18%;
            background: black;
            color: white;
            text-align: center;
            line-height: 15px;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            font-size: 14px;
            font-weight: bold;
            padding-top: 10px;
            background-color: rgb(0, 0, 0);
            
        }

        .trapezium-middle {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 8%;
            background: black;
            color: white;
            text-align: center;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: start;
        }

        .trapezium-middle .single{
            margin-top: 25px;
        }

        td.active .trapezium {
                background-image: linear-gradient(to bottom,rgb(182, 0, 0), rgb(221, 0, 0));
        }

        .visualiser-container {
            display: none;
        }

        td.active .visualiser-container {
            display: flex;
            width: 75%;
            height: 60px;
            margin: auto;
            position: relative;
        }

        td.active .visualiser-container-middle {
            position: absolute;
            top: 33%;
            left: 58.5%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 60px;
        }

        canvas.visualiser {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Decibel Meter Styles */
        .decibel-meter-container {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 80px;
            display: block; /* Always visible */
        }

        .decibel-meter {
            width: 100%;
            height: 50px;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid #333;
        }

        .decibel-gradient {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, 
                rgb(66, 182, 66) 0%, 
                rgb(127, 204, 51) 10%, 
                rgb(177, 210, 37) 20%, 
                rgb(208, 195, 31) 30%, 
                rgb(231, 176, 24) 40%, 
                rgb(237, 153, 17) 50%, 
                rgb(242, 130, 12) 60%, 
                rgb(246, 106, 6) 70%, 
                rgb(250, 82, 3) 80%, 
                rgb(251, 57, 2) 90%, 
                rgb(250, 32, 3) 100%);
        }

        .decibel-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.5);
            padding: 0 4px;
            box-sizing: border-box;
        }

        .decibel-indicator {
            position: absolute;
            top: 0;
            height: 100%;
            width: 5px;
            background-color: white;
            transition: left 1s ease-in-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .decibel-label {
            text-align: center;
            color: black;
            font-weight: bold;
            font-size: 24px;
            margin-top: 10px;
        }

        /* Add canvas to audio3 */
        #audio3 .visualiser-container {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            height: 60px;
        }
    </style>
</head>

<body>
    <table width="1366px" height="1024px" border="2px" cellspacing="0" cellpadding="0">
        <tr>
            <td id="audio0">
                <div class="pair">
                    <img class="icon" src="/assets/watch.png">
                    <h2>Watch <br> Ticking</h2>
                </div>

                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="20"></canvas>
                </div>
                <div class="trapezium">
                    <strong class="single">20dB</strong>
                </div>
            </td>
            <td id="audio3" rowspan="3">
                <a class="reload" onClick="window.location.reload();">
                    <img class="logo" src="./assets/logo.jpg">
                </a>
                <h2 class="center-title"><span class="red-text">Isuzu</span>Generator Running</h2>
                <img class="colour-img" src="/assets/generator.png">
                <img class="outline-img" src="/assets/outline_generator.png">
                <!-- Decibel meter always appears here -->
                <div class="decibel-meter-container">
                    <div class="decibel-meter">
                        <div class="decibel-gradient"></div>
                        <div class="decibel-numbers">
                            <span>0</span>
                            <span>30</span>
                            <span>60</span>
                            <span>90</span>
                            <span>120</span>
                            <span>150</span>
                            <!-- <span>180</span> -->
                        </div>
                        <div class="decibel-indicator"></div>
                    </div>
                    <!-- <div class="decibel-label">55 dB</div> -->
                </div>
                <!-- Added visualiser container for audio3 -->
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="55"></canvas>
                </div>
                <div class="trapezium-middle">
                    <strong class="single">51 - 57dB</strong>
                </div>
            </td>
            <td id="audio4">
                <div class="pair">
                    <img class="icon" src="/assets/vacuum.png">
                    <h2>Vacuum <br> Cleaner</h2>
                </div>
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="70"></canvas>
                </div>
                <div class="trapezium">
                    <strong class="single">70dB<br>
                        <!-- <p class="subtext">(2x the volume)</p> -->
                    </strong>
                </div>
            </td>
        </tr>
        <tr>
            <td id="audio1">
                <div class="pair">
                    <img class="icon" src="/assets/leaf.png">
                    <h2>Leaves <br> Rustling</h2>
                </div>
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="30"></canvas>
                </div>
                <div class="trapezium">
                    <strong>30dB</strong>
                </div>
            </td>
            <td id="audio5">
                <div class="pair">
                    <img class="icon" src="/assets/motorbike.png">
                    <h2>Motorcycle</h2>
                </div>
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="100"></canvas>
                </div>
                <div class="trapezium">
                    <strong class="single">100dB<br>
                        <!-- <p class="subtext">(32x the volume)</p> -->
                    </strong>
                </div>
            </td>
        </tr>
        <tr>
            <td id="audio2">
                <div class="pair">
                    <img class="icon" src="/assets/conversation.png">
                    <h2>Normal <br> Conversation</h2>
                </div>
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="50"></canvas>
                </div>
                <div class="trapezium">
                    <strong>50dB</strong>
                </div>
            </td>
            <td id="audio6">
                <div class="pair">
                    <img class="icon" src="/assets/plane.png">
                    <h2>Jet <br> Takeoff</h2>
                </div>
                <div class="visualiser-container">
                    <canvas class="visualiser" data-db="140"></canvas>
                </div>
                <div class="trapezium">
                    <strong class="single">140dB<br>
                        <!-- <p class="subtext">(2,048x the volume)</p> -->
                    </strong>
                </div>
            </td>
        </tr>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        var audioFiles = [
            // Quiet
            '20db_watch-ticking.mp3',
            '30db_leaves-rustling.mp3',
            '50db_normal-conversation.mp3',
            // Hero
            '55db_isuzu-generator.mp3',
            // Loud
            '70db_vacuum-cleaner.mp3',
            '100db_motorcycle.mp3',
            '140db_jet-takeoff.mp3'
        ];

        // Decibel levels for each audio
        var dbLevels = [20, 30, 50, 55, 80, 100, 140];

        // Web Audio API Context
        let audioContext;
        let analyser;
        let dataArray;
        let source;
        let currentvisualiser;
        let animationFrame;
        let currentAudioElement;
        let isAudioInitialized = false;
        let isAudioChanging = false;

        // Initialize audio context
        function initAudio() {
            // Create audio context if it doesn't exist
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                isAudioInitialized = true;
            }
        }

        // Stop current audio
        function stopCurrentAudio() {
            if (currentAudioElement) {
                currentAudioElement.pause();
                currentAudioElement.currentTime = 0;

                // Disconnect previous source if it exists
                if (source) {
                    try {
                        source.disconnect();
                    } catch (e) {
                        // Ignore disconnect errors
                    }
                    source = null;
                }

                currentAudioElement = null;
            }

            // Stop animation
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
        }

        // Draw the visualization
        function draw(canvas, dbLevel, isAudio3 = false) {
            if (!canvas) return;
            
            // Scale the visualization based on the decibel level
            const amplification = dbLevel / 40;

            // Get drawing context
            const canvasCtx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            // Clear canvas
            canvasCtx.clearRect(0, 0, width, height);

            // Get frequency data
            analyser.getByteFrequencyData(dataArray);

            // Use bar visualization for all sound levels
            drawBars(canvasCtx, width, height, amplification, isAudio3);

            // Continue animation
            animationFrame = requestAnimationFrame(() => draw(canvas, dbLevel, isAudio3));
        }

        // Draw bar visualization for all sounds
        function drawBars(canvasCtx, width, height, amplification, isAudio3 = false) {
            const barWidth = width / dataArray.length * 2.5;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                // Skip some bars for better visual spacing
                if (i % 2 !== 0) continue;

                const barHeight = (dataArray[i] / 255) * height * amplification * 0.8;

                // Set the color to red if it's audio3, otherwise white
                canvasCtx.fillStyle = isAudio3 ? 'rgb(0, 0, 0)' : 'rgb(250, 250, 250)';
                // canvasCtx.fillStyle = 'rgb(255, 255, 255)';

                // Center the bars vertically
                canvasCtx.fillRect(x, (height - barHeight) / 2, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // Set decibel indicator position based on dB value
        function setDecibelIndicator(dbLevel) {
            // Calculate position (percentage) based on dB level
            // Max dB in our scale is 150, so calculate percentage
            let percentage = Math.min((dbLevel / 155) * 100, 100);
            
            // Update indicator
            $(".decibel-indicator").css("left", percentage + "%");
            
            // Update the label
            $(".decibel-label").text(dbLevel + " dB");
        }

        // Play audio function to avoid duplication
        function playAudio($cell, audioSrc, dbLevel) {
            if (isAudioChanging) return;
            isAudioChanging = true;
            
            // Reset all cells
            $('td.active').removeClass('active');
            
            // Set active state
            $cell.addClass('active');
            
            // First, stop any playing audio
            stopCurrentAudio();
            
            // Update decibel meter
            setDecibelIndicator(dbLevel);
            
            // Find the canvas
            const $canvas = $cell.find('canvas.visualiser');
            
            // Show the canvas
            $canvas.show();
            
            // Initialize audio if needed
            if (!isAudioInitialized) {
                initAudio();
            }
            
            // Check if it's audio3
            const isAudio3 = $cell.attr('id') === 'audio3';
            
            // Create new audio element
            currentAudioElement = new Audio(audioSrc);
            
            // Set load listener
            currentAudioElement.addEventListener('canplay', function audioReadyHandler() {
                // Remove the event listener to prevent multiple calls
                currentAudioElement.removeEventListener('canplay', audioReadyHandler);
                
                try {
                    // Create media source from audio element
                    source = audioContext.createMediaElementSource(currentAudioElement);
                    
                    // Connect the audio chain
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    // Start visualization
                    currentvisualiser = $canvas[0];
                    
                    // Clear the canvas
                    const ctx = currentvisualiser.getContext('2d');
                    ctx.clearRect(0, 0, currentvisualiser.width, currentvisualiser.height);
                    
                    // Play audio
                    currentAudioElement.play()
                    .then(() => {
                        // Start visualization
                        draw(currentvisualiser, dbLevel, isAudio3);
                        isAudioChanging = false;
                    })
                    .catch(e => {
                        console.error("Audio play error:", e);
                        isAudioChanging = false;
                    });
                } catch (e) {
                    console.error("Audio setup error:", e);
                    isAudioChanging = false;
                }
            });
            
            // Handle audio end
            currentAudioElement.addEventListener('ended', function() {
                // Reset cell
                $cell.removeClass('active');
                
                // Stop visualization
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                
                // Clear canvas
                if (currentvisualiser) {
                    const ctx = currentvisualiser.getContext('2d');
                    ctx.clearRect(0, 0, currentvisualiser.width, currentvisualiser.height);
                }
                
                // Hide canvas
                $canvas.hide();
                
                // Reset variables
                if (source) {
                    source.disconnect();
                    source = null;
                }
                currentAudioElement = null;
                currentvisualiser = null;
                
                // Reset decibel indicator
                setDecibelIndicator(2);
                
                isAudioChanging = false;
            });
            
            // Load audio
            currentAudioElement.load();
        }

        jQuery(function ($) {
            // Setup canvas sizes
            $('canvas.visualiser').each(function () {
                const canvas = $(this)[0];
                // Set actual dimensions for best rendering
                canvas.width = $(this).parent().width();
                canvas.height = $(this).parent().height();
                // Hide canvas initially
                $(this).hide();
            });

            setDecibelIndicator(2);

            // Click handler for all cells including audio3
            $(document).on('click', 'td', function (e) {
                // Prevent clicking on logo/reload button from triggering audio
                if ($(e.target).hasClass('logo') || $(e.target).hasClass('reload')) {
                    return;
                }
                
                // Get cell and audio info
                const $cell = $(this);
                const audioId = $cell.attr('id');
                const audioIndex = parseInt(audioId.replace(/\D+/, ''));
                const audioSrc = '/audio/' + audioFiles[audioIndex];
                const dbLevel = dbLevels[audioIndex];
                
                // Play the audio
                playAudio($cell, audioSrc, dbLevel);
            });

            // Add touch support
            $(document).on('touchstart', 'td', function (e) {
                // Prevent default touch behavior
                e.preventDefault();
                
                // Prevent clicking on logo/reload button from triggering audio
                if ($(e.target).hasClass('logo') || $(e.target).hasClass('reload')) {
                    return;
                }
                
                // Get cell and audio info
                const $cell = $(this);
                const audioId = $cell.attr('id');
                const audioIndex = parseInt(audioId.replace(/\D+/, ''));
                const audioSrc = '/audio/' + audioFiles[audioIndex];
                const dbLevel = dbLevels[audioIndex];
                
                // Play the audio
                playAudio($cell, audioSrc, dbLevel);
            });
        });
    </script>
</body>

</html>

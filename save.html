<!DOCTYPE html>
<html>

<head>
    <title>Isuzu Generator Sound Demo</title>
    <style>
        html,
        body {
            height: 100vh;
            margin: 0;
            padding: 0
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Helvetica, Arial, san-serif
        }

        h2 {
            width: 60%;
            font-size: 2em;
            font-weight: 500;
            margin: 0;
            padding: 0;
            text-align: right;
        }

        td.active h2 {
            width: 100%;
            font-size: 1.6em;
            text-align: center;
            color: white;
            position: absolute;
            top: 10%;
        }

        td.active br {
            display: none;
        }

        h2.center-title {
            position: relative;
            top: 7%;
            width: 100%;
            text-align: center;
            font-size: 2.7em;
        }

        h2.center-title .red-text {
            color: rgb(213, 0, 0);
            display: block;
            margin-bottom: 5px;
        }

        strong {
            display: block;
            font-size: 1.2rem;
        }

        table {
            height: 100vh;
            border-collapse: collapse;
        }

        td {
            position: relative;
            width: 28vw;
            height: 33vh;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            background-color: rgb(250, 250, 250);
        }

        td[rowspan="3"] {
            width: 44%;
            height: 100%;
            background-image:
                linear-gradient(to top, white, transparent 40%),
                linear-gradient(to bottom, white, transparent 40%),
                url('/assets/bg.jpg');
            background-position: center;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        td[rowspan="3"].active {
            background-image:
                linear-gradient(to top, white, transparent 40%),
                linear-gradient(to bottom, white, transparent 40%),
                url('/assets/bg.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        td.active {
            background-image: linear-gradient(to bottom, rgb(243, 0, 0), rgb(182, 0, 0));
        }

        .subtext {
            font-size: 14px;
            line-height: 15px;
            font-weight: 300;
            margin: 0;
        }

        .logo {
            width: 30%;
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
        }

        .generator-img {
            width: 100%;
            position: relative;
            display: block;
            margin: 0;
            mix-blend-mode: multiply;
            object-fit: contain;
            overflow: hidden;
            z-index: 0;
        }

        .trapezium {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 17%;
            background: black;
            color: white;
            text-align: center;
            line-height: 15px;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            font-size: 14px;
            font-weight: bold;
            padding-top: 8px;
        }

        .trapezium-middle {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 8%;
            background: black;
            color: white;
            text-align: center;
            line-height: 20px;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            padding-top: 15px;
        }

        .trapezium.active,
        .trapezium-middle.active {
            background: rgb(230, 0, 0);
        }

        .icon {
            display: block;
            margin: 10px auto;
            height: 50px;
        }
    </style>
</head>

<body>
    <table width="100%" height="100%" border="1" cellspacing="0" cellpadding="0">
        <tr>
            <td id="audio0">
                <h2>Calm <br> Breathing</h2>
                <div class="trapezium">
                    <strong>10db</strong>
                </div>
            </td>
            <td id="audio3" rowspan="3">
                <img class="logo" src="/assets/logo.jpg">
                <h2 class="center-title"><span class="red-text">Isuzu</span> Generator Running</h2>
                <img class="generator-img" src="/assets/generator.jpg">
                <div class="trapezium-middle">
                    <strong>51 - 57db</strong>
                </div>
            </td>
            <td id="audio4">
                <h2>Loud <br> Conversation</be>
                </h2>
                <div class="trapezium">
                    <strong>60db<br>
                        <p class="subtext">(2x the volume)</p>
                    </strong>
                </div>
            </td>
        </tr>
        <tr>
            <td id="audio1">
                <h2>Quiet <br> Room</h2>
                <div class="trapezium">
                    <strong>30db</strong>
                </div>
            </td>
            <td id="audio5">
                <h2>Jackhammer</h2>
                <div class="trapezium">
                    <strong>100db<br>
                        <p class="subtext">(32x the volume)</p>
                    </strong>
                </div>
            </td>
        </tr>
        <tr>
            <td id="audio2">
                <h2>Normal <br> Conversation</h2>
                <div class="trapezium">
                    <strong>50db</strong>
                </div>
            </td>
            <td id="audio6">
                <h2>Rifle <br> Firing</h2>
                <div class="trapezium">
                    <strong>160db<br>
                        <p class="subtext">(4,096x the volume)</p>
                    </strong>
                </div>
            </td>
        </tr>
    </table>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        var audioFiles = [
            // Quiet
            '10db_calm-breathing.mp3',
            '30db_quiet-room.mp3',
            '50db_normal-conversation.mp3',
            // Hero
            '55db_isuzu-generator.mp3',
            // Loud
            '60db_loud-conversation.mp3',
            // '70db_vacuum-cleaner.mp3' ,
            '100db_jackhammer.mp3',
            '170db_rifle-firing.mp3'
        ];

        jQuery(function ($) {
            var audio = null;

            $(document).on('click', 'td', function (e) {
                var $t = $(this);
                var audioIndex = $t.attr('id').replace(/\D+/, '');

                console.log('Clicked');
                console.log(audioFiles[audioIndex]);

                // Stop and reset the previous audio if one is playing
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                    $('td.active').removeClass('active');
                    $('.trapezium.active').removeClass('active');
                    $('.trapezium-middle.active').removeClass('active');
                }

                // Set new active state
                $t.addClass('active');
                $t.find('.trapezium').addClass('active');
                $t.find('.trapezium-middle').addClass('active');
                audio = new Audio('/audio/' + audioFiles[audioIndex]);
                audio.play();
                audio.onended = function () {
                    $t.removeClass('active');
                    $t.find('.trapezium').removeClass('active');
                    $t.find('.trapezium-middle').removeClass('active');
                    audio = null;
                };
            });
        });
    </script>
</body>

</html>
